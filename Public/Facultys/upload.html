<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Resources | Smart Campus</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <h2>CampusMind</h2>
        <p class="portal">Faculty Portal</p>

        <nav>
            <a href="facultydashboard.html">Dashboard</a>
            <a href="search.html">Search</a>
            <a href="courses.html">My Courses</a>
            <a class="active" href="upload.html">Upload Resource</a>
            <a href="manage.html">Manage Docs</a>
            <a href="analytics.html">Analytics</a>
            <a href="profile.html">Profile</a>
            <a href="index.html">Logout</a>
        </nav>
    </aside>

    <main>

        <div class="page-header">
            <h1>Upload Course Resources</h1>
            <p class="subtitle">
                Add notes, assignments, presentations or study materials
            </p>
        </div>

        <div class="upload-wrapper">

            <div class="upload-card">

                <form>

                    <div class="form-group">
                        <label>Course</label>
                        <select>
                            <option>Select Course</option>
                            <option>CS301 - Machine Learning</option>
                            <option>CS205 - Data Structures</option>
                            <option>CS410 - Artificial Intelligence</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Resource Title</label>
                        <input type="text" placeholder="Enter resource title">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea placeholder="Short description about this material"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Upload File</label>
                        <input type="file">
                    </div>

                    <button type="submit" class="upload-btn">
                        Upload Resource
                    </button>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
